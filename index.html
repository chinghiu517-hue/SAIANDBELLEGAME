<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>笑笑熊國：對戰與故事合作雙模式</title>
  <style>
    :root {
      --bg-color: #fffaf0;
      --panel-bg: #ffffff;
      --p1-color: #ffb3ba;
      --p2-color: #bae1ff;
      --accent-honey: #f6d365;
      --text-main: #5c4b51;
      --text-muted: #8c7b83;
      --border-radius: 12px;
      --shadow: 0 6px 16px rgba(92, 75, 81, 0.12);
    }

    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #app { width: 100%; max-width: 650px; height: 100vh; max-height: 920px; display: flex; flex-direction: column; position: relative; background: var(--bg-color); box-shadow: var(--shadow); overflow: hidden; }

    .screen { display: none; flex-direction: column; height: 100%; width: 100%; padding: 10px; position: absolute; top: 0; left: 0; background-color: var(--bg-color); z-index: 1; overflow-y: auto; }
    .screen.active { display: flex; z-index: 2; }

    h1 { font-size: 1.4rem; text-align: center; color: var(--text-main); margin-bottom: 4px; }
    h2 { font-size: 1.1rem; text-align: center; margin-bottom: 6px; }
    p { font-size: 0.8rem; line-height: 1.3; color: var(--text-muted); text-align: center; }

    .btn {
      background: linear-gradient(135deg, var(--accent-honey), #fda085);
      border: none; color: #fff; padding: 10px 16px; font-size: 0.9rem; font-weight: bold;
      border-radius: 18px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s; text-align: center; margin: 4px 0; width: 100%;
    }
    .btn:active { transform: scale(0.96); }
    .btn-action { font-size: 0.65rem; padding: 3px 6px; border-radius: 6px; border: none; cursor: pointer; }

    .game-header { background: var(--panel-bg); padding: 6px 10px; border-radius: var(--border-radius); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .stat-box { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 0.6rem; color: var(--text-muted); }
    .stat-value { font-size: 0.8rem; font-weight: bold; }

    .event-banner { background: #e3f2fd; border: 1px solid #bbdefb; color: #0d47a1; padding: 4px 8px; border-radius: 8px; font-size: 0.68rem; margin-bottom: 4px; }

    .grid-container { display: grid; grid-gap: 4px; background: var(--panel-bg); padding: 6px; border-radius: var(--border-radius); box-shadow: var(--shadow); aspect-ratio: 1; width: 100%; margin: 2px 0; }
    .grid-4x4 { grid-template-columns: repeat(4, 1fr); }
    .grid-6x6 { grid-template-columns: repeat(6, 1fr); }

    .grid-cell { background: #f3efe6; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; position: relative; }
    .grid-cell.p1-owner { background: var(--p1-color); }
    .grid-cell.p2-owner { background: var(--p2-color); }
    .grid-cell.lake { background: #f8bbd0; border: 1.5px solid #ec407a; }
    .grid-cell.obstacle { background: #b0bec5; cursor: not-allowed; }

    .action-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 4px 0; }
    .action-btn { background: #fff; border: 1.5px solid #ffd54f; border-radius: 8px; padding: 8px; text-align: center; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .action-btn.disabled { opacity: 0.5; cursor: not-allowed; background: #eee; border-color: #ccc; }

    .card-hand { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0; margin-bottom: 4px; }
    .card {
      background: var(--panel-bg); border: 2px solid #e2dcd5; border-radius: 8px;
      padding: 4px; min-width: 80px; width: 80px; display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; box-shadow: var(--shadow); cursor: pointer; height: 110px; flex-shrink: 0;
    }
    .card.selected { border-color: #ff9800; background-color: #fff8e1; transform: translateY(-2px); }

    .modal-overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; padding: 12px; border-radius: var(--border-radius); width: 92%; max-height: 85%; overflow-y: auto; }

    /* 簡化版國家卡片 */
    .country-select-card { background: #fff; border: 2px solid #ffe0b2; border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .country-select-card:hover { border-color: #ff9800; background-color: #fffde7; }
    .country-name { font-size: 1rem; font-weight: bold; color: #333; }
    .country-status { font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
    .status-passed { background: #e8f5e9; color: #2e7d32; }
    .status-unpassed { background: #ffebee; color: #c62828; }

    .mini-game-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 8px 0; }
    .mini-game-cell { background: #e0f2f1; border-radius: 4px; height: 35px; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .memory-card { background: #ffe0b2; border-radius: 6px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; }
  </style>
</head>
<body>

<div id="app">
  <!-- 黑市彈窗 -->
  <div id="blackmarket-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>🖤 黑市交易</h2>
      <p>可以使用蜜糖購買強力的特別卡牌：</p>
      <div id="blackmarket-items" style="margin: 8px 0;"></div>
      <button class="btn" onclick="closeModal('blackmarket-modal')">離開黑市</button>
    </div>
  </div>

  <!-- 森林小遊戲彈窗 -->
  <div id="minigame-modal" class="modal-overlay">
    <div class="modal-content" id="minigame-content"></div>
  </div>

  <!-- 開始主選單 -->
  <div id="start-screen" class="screen active">
    <div style="font-size:3.5rem; text-align:center; margin-top:20px;">🐻🏰🐷</div>
    <h1>笑笑熊國遊戲大廳</h1>
    <p>請選擇遊戲模式：</p>
    <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 10px;">
      <button class="btn" style="background: linear-gradient(135deg, #ffb3ba, #ff6b6b);" onclick="startPvpGame()">⚔️ 雙人對戰模式 (4x4)</button>
      <button class="btn" style="background: linear-gradient(135deg, #81c784, #388e3c);" onclick="showCountrySelect()">📖 故事拯救模式 (2人合作 6x6)</button>
    </div>
  </div>

  <!-- 故事模式：國家選擇 (僅顯示名字與過關狀態) -->
  <div id="country-screen" class="screen">
    <h2>🗺️ 選擇要拯救的國家</h2>
    <div id="country-list"></div>
    <button class="btn" style="background:#90a4ae;" onclick="switchScreen('start-screen')">⬅️ 返回主選單</button>
  </div>

  <!-- 主遊戲畫面 -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <div class="stat-box"><span class="stat-label">回合</span><span id="ui-round" class="stat-value">1/12</span></div>
      <div class="stat-box"><span class="stat-label">當前行動</span><span id="ui-player" class="stat-value">🐻 小熊熊</span></div>
      <div class="stat-box"><span class="stat-label">蜜糖</span><span id="ui-honey" class="stat-value">🍯 5</span></div>
      <div class="stat-box"><span class="stat-label">分數</span><span id="ui-score" class="stat-value">✨ 0</span></div>
    </div>

    <div id="ui-event-banner" class="event-banner">📢 遊戲進行中...</div>

    <!-- 地圖 -->
    <div class="grid-container grid-4x4" id="grid-container"></div>

    <!-- 行動面板 -->
    <div class="action-panel" id="action-panel">
      <div class="action-btn" id="btn-act-build" onclick="selectAction('build')">🏠 放置建築物</div>
      <div class="action-btn" id="btn-act-forest" onclick="selectAction('forest')">🌲 森林採蜜 (小遊戲)</div>
      <div class="action-btn" id="btn-act-blackmarket" onclick="selectAction('blackmarket')">🖤 黑市交易</div>
      <div class="action-btn" id="btn-act-cards" onclick="selectAction('cards')">🎲 抽卡/洗牌 (1🍯)</div>
    </div>

    <div id="hand-section">
      <b style="font-size:0.75rem;">🎴 當前手牌：</b>
      <div class="card-hand" id="drawn-hand"></div>
    </div>

    <div class="log-box" id="ui-log" style="font-size:0.7rem; background:#fff; padding:4px; border-radius:6px; min-height:35px; margin-bottom:2px;">請選擇行動！</div>
    <div style="flex:1"></div>
    <button class="btn" id="end-turn-btn" onclick="finishTurn()">完成行動 ➔ 切換回合</button>
  </div>

  <!-- 結算畫面 -->
  <div id="end-screen" class="screen">
    <div style="font-size:3.5rem; text-align:center;" id="end-icon">🎉</div>
    <h1 id="end-title">遊戲結算</h1>
    <div style="font-size:1.3rem; font-weight:bold; text-align:center; margin:8px 0;" id="end-status">計算中...</div>
    <div style="font-size:0.8rem; text-align:center; color:var(--text-muted); white-space:pre-line;" id="end-details"></div>
    <div style="flex:1"></div>
    <button class="btn" onclick="showCountrySelect()">返回選擇關卡</button>
  </div>
</div>

<script>
  let gameMode = 'pvp';
  
  const PVP_BUILDINGS = [
    { id: 'house', name: '小熊屋', icon: '🏠', cost: 1, points: 10 },
    { id: 'honey_factory', name: '蜜糖工廠', icon: '🏭', cost: 2, points: 25 },
    { id: 'flower_garden', name: '花園', icon: '🌻', cost: 1, points: 15 },
    { id: 'castle', name: '笑笑城堡', icon: '🏰', cost: 3, points: 50 }
  ];

  const COUNTRIES = [
    {
      id: 'dalmatian', name: '1. 斑點狗國 🐶',
      desc: '任務：蓋滿 10 個斑點狗屋、分數達 400 分。\n限制：暴雨時建屋有機率失敗！',
      targetScore: 400, targetHouses: 10,
      buildings: [
        { id: 'dal_house', name: '斑點狗屋', icon: '🐶', cost: 1, points: 25 },
        { id: 'park', name: '狗狗公園', icon: '🛝', cost: 2, points: 30 }
      ]
    },
    {
      id: 'dolphin', name: '2. 海豚國 🐬',
      desc: '任務：每個海豚屋附近必須有圖書館、分數達 450 分。\n限制：小熊熊怕水，放置卡牌有 25% 機率失敗！',
      targetScore: 450,
      buildings: [
        { id: 'dol_house', name: '海豚屋', icon: '🐬', cost: 2, points: 35 },
        { id: 'library', name: '圖書館', icon: '📚', cost: 2, points: 20 }
      ]
    },
    {
      id: 'bigdog', name: '3. 大頭狗國 🐶❤️',
      desc: '任務：建立 3 個公園、分數達 450 分。\n限制：小熊熊想念細肥的，只能「購買卡牌/黑市交易」！',
      targetScore: 450,
      buildings: [
        { id: 'big_park', name: '大頭公園', icon: '🌲', cost: 3, points: 50 }
      ]
    },
    {
      id: 'pinkbear', name: '4. 粉紅熊國 🐻🌸',
      desc: '任務：包圍粉紅湖，第 5 局起湖水每局擴展（每格扣 20 分），分數達 450 分。\n限制：毛巾豬心情低落，不能放置建築與採蜜！',
      targetScore: 450,
      buildings: [
        { id: 'pink_tree', name: '粉紅樹木', icon: '🌲', cost: 1, points: 15 }
      ]
    },
    {
      id: 'penguin', name: '5. 企鵝國 🐧❄️',
      desc: '任務：炸毀全部 5 個障礙物（殘留扣分）、分數達 500 分。\n限制：小熊熊被誤認，手牌上限縮減至 3 張！',
      targetScore: 500,
      buildings: [
        { id: 'ice_house', name: '冰屋', icon: '🧊', cost: 2, points: 40 }
      ]
    }
  ];

  let currentCountry = null;
  let forestMiniGameCount = 0; // 每回合小遊戲次數記錄（最多 2 次）

  let gameState = {
    round: 1, maxRounds: 10,
    activePlayer: 'p1',
    p1Honey: 5, p2Honey: 5,
    p1Score: 0, p2Score: 0,
    grid: [], hand: [],
    selectedIndex: -1,
    dalmatianHouses: 0,
    lakeExpandCount: 0
  };

  function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  /* --- 國家通關記錄 (使用 localStorage) --- */
  function getPassedCountries() {
    return JSON.parse(localStorage.getItem('passed_countries') || '{}');
  }

  function markCountryPassed(id) {
    const passed = getPassedCountries();
    passed[id] = true;
    localStorage.setItem('passed_countries', JSON.stringify(passed));
  }

  /* --- 故事模式選關 (僅顯示名字與過關狀態) --- */
  function showCountrySelect() {
    switchScreen('country-screen');
    const container = document.getElementById('country-list');
    container.innerHTML = '';
    const passedMap = getPassedCountries();

    COUNTRIES.forEach(c => {
      const isPassed = !!passedMap[c.id];
      const card = document.createElement('div');
      card.className = 'country-select-card';
      card.innerHTML = `
        <span class="country-name">${c.name}</span>
        <span class="country-status ${isPassed ? 'status-passed' : 'status-unpassed'}">
          ${isPassed ? '✅ 已通關' : '❌ 未通關'}
        </span>
      `;
      card.onclick = () => startStoryGame(c);
      container.appendChild(card);
    });
  }

  /* --- 遊戲初始化 --- */
  function startPvpGame() {
    gameMode = 'pvp';
    gameState.round = 1;
    gameState.maxRounds = 10;
    gameState.activePlayer = 'p1';
    gameState.p1Honey = 5; gameState.p2Honey = 5;
    gameState.p1Score = 0; gameState.p2Score = 0;
    gameState.grid = Array(16).fill(null);
    forestMiniGameCount = 0;
    
    drawCards(4);
    document.getElementById('grid-container').className = "grid-container grid-4x4";
    switchScreen('game-screen');
    updateUI();
  }

  function startStoryGame(country) {
    gameMode = 'story';
    currentCountry = country;
    gameState.round = 1;
    gameState.maxRounds = 12;
    gameState.activePlayer = 'p1';
    gameState.p1Honey = 5;
    gameState.p1Score = 0;
    gameState.grid = Array(36).fill(null);
    gameState.dalmatianHouses = 0;
    gameState.lakeExpandCount = 0;
    forestMiniGameCount = 0;

    if (country.id === 'pinkbear') {
      [14, 15, 20, 21].forEach(i => gameState.grid[i] = { type: 'lake', name: '粉紅湖', icon: '🌸' });
    } else if (country.id === 'penguin') {
      [2, 11, 20, 27, 33].forEach(i => gameState.grid[i] = { type: 'obstacle', name: '冰塊障礙', icon: '🧊' });
    }

    drawCards(country.id === 'penguin' ? 3 : 5);
    document.getElementById('grid-container').className = "grid-container grid-6x6";
    switchScreen('game-screen');
    updateUI();
  }

  function drawCards(count) {
    gameState.hand = [];
    const pool = gameMode === 'pvp' ? PVP_BUILDINGS : currentCountry.buildings;
    for (let i = 0; i < count; i++) {
      const b = pool[Math.floor(Math.random() * pool.length)];
      gameState.hand.push({ ...b });
    }
  }

  function updateUI() {
    const isP1 = gameState.activePlayer === 'p1';
    document.getElementById('ui-round').innerText = `${gameState.round}/${gameState.maxRounds}`;
    document.getElementById('ui-player').innerText = isP1 ? '🐻 小熊熊' : '🐷 毛巾豬';

    if (gameMode === 'pvp') {
      document.getElementById('ui-honey').innerText = `🍯 ${isP1 ? gameState.p1Honey : gameState.p2Honey}`;
      document.getElementById('ui-score').innerText = `✨ P1:${gameState.p1Score} | P2:${gameState.p2Score}`;
      document.getElementById('ui-event-banner').innerText = `⚔️ 對戰模式：佔領 4x4 領地，獲得最高分者勝出！`;
    } else {
      document.getElementById('ui-honey').innerText = `🍯 ${gameState.p1Honey}`;
      document.getElementById('ui-score').innerText = `✨ ${gameState.p1Score}`;
      document.getElementById('ui-event-banner').innerText = `📢 【${currentCountry.name}】${currentCountry.desc.split('\n')[0]} (採蜜本局：${forestMiniGameCount}/2次)`;
    }

    const btnBuild = document.getElementById('btn-act-build');
    const btnForest = document.getElementById('btn-act-forest');
    btnBuild.classList.remove('disabled');
    btnForest.classList.remove('disabled');

    if (gameMode === 'story') {
      if (currentCountry.id === 'bigdog' && isP1) {
        btnBuild.classList.add('disabled');
        document.getElementById('ui-log').innerText = "⚠️ 小熊熊去找細肥的，本回合無法放置建築！";
      }
      if (currentCountry.id === 'pinkbear' && !isP1) {
        btnBuild.classList.add('disabled');
        btnForest.classList.add('disabled');
        document.getElementById('ui-log').innerText = "⚠️ 毛巾豬心情低落，無法放置建築與採蜜！";
      }
    }

    renderGrid();
    renderHand();
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid-container');
    gridEl.innerHTML = '';

    gameState.grid.forEach((cell, idx) => {
      const cellEl = document.createElement('div');
      cellEl.className = 'grid-cell';
      if (cell) {
        if (cell.owner === 'p1') cellEl.classList.add('p1-owner');
        if (cell.owner === 'p2') cellEl.classList.add('p2-owner');
        if (cell.type === 'lake') cellEl.classList.add('lake');
        if (cell.type === 'obstacle') cellEl.classList.add('obstacle');
        cellEl.innerText = cell.icon || '';
      }
      cellEl.onclick = () => handleCellClick(idx);
      gridEl.appendChild(cellEl);
    });
  }

  function renderHand() {
    const container = document.getElementById('drawn-hand');
    container.innerHTML = '';

    gameState.hand.forEach((card, idx) => {
      const cardEl = document.createElement('div');
      const isSelected = gameState.selectedIndex === idx;
      cardEl.className = `card ${isSelected ? 'selected' : ''}`;
      cardEl.innerHTML = `
        <div style="font-size:1.2rem;">${card.icon}</div>
        <div style="font-size:0.65rem; font-weight:bold;">${card.name}</div>
        <div style="font-size:0.6rem; color:#f57c00;">🍯 ${card.cost}</div>
        <div style="font-size:0.55rem; color:#e65100;">✨ ${card.points}分</div>
        <button class="btn-action" style="background:#ffd54f;" onclick="selectCard(${idx})">${isSelected ? '取消' : '選擇'}</button>
      `;
      container.appendChild(cardEl);
    });
  }

  function selectCard(idx) {
    gameState.selectedIndex = gameState.selectedIndex === idx ? -1 : idx;
    renderHand();
  }

  /* --- 行動觸發與森林小遊戲 (最多2次/回合) --- */
  function selectAction(type) {
    const isP1 = gameState.activePlayer === 'p1';

    if (type === 'forest') {
      if (forestMiniGameCount >= 2) {
        alert("⚠️ 本局森林採蜜小遊戲次數已達上限 (最多 2 次)！");
        return;
      }
      if (gameMode === 'story' && currentCountry.id === 'pinkbear' && !isP1) {
        alert("毛巾豬心情低落，無法前往森林！");
        return;
      }
      triggerForestMiniGame();
    } else if (type === 'blackmarket') {
      openBlackMarket();
    } else if (type === 'cards') {
      let honey = gameMode === 'pvp' ? (isP1 ? gameState.p1Honey : gameState.p2Honey) : gameState.p1Honey;
      if (honey < 1) { alert("蜜糖不足 1 個！"); return; }
      
      if (gameMode === 'pvp') {
        if (isP1) gameState.p1Honey--; else gameState.p2Honey--;
        drawCards(4);
      } else {
        gameState.p1Honey--;
        drawCards(currentCountry.id === 'penguin' ? 3 : 5);
      }
      document.getElementById('ui-log').innerText = "🔄 已刷新手牌！";
      updateUI();
    }
  }

  function handleCellClick(index) {
    const isP1 = gameState.activePlayer === 'p1';

    if (gameMode === 'story') {
      if (currentCountry.id === 'bigdog' && isP1) { alert("小熊熊尋找細肥的中，無法放置！"); return; }
      if (currentCountry.id === 'pinkbear' && !isP1) { alert("毛巾豬心情低落，無法放置！"); return; }
    }

    if (gameState.selectedIndex === undefined || gameState.selectedIndex === -1) {
      document.getElementById('ui-log').innerText = "請先選擇手牌！";
      return;
    }

    const card = gameState.hand[gameState.selectedIndex];
    let curHoney = gameMode === 'pvp' ? (isP1 ? gameState.p1Honey : gameState.p2Honey) : gameState.p1Honey;

    if (card.id === 'bomb') {
      if (!gameState.grid[index] || gameState.grid[index].type !== 'obstacle') {
        alert("炸彈只能炸毀障礙物！");
        return;
      }
      gameState.grid[index] = null;
      gameState.hand.splice(gameState.selectedIndex, 1);
      gameState.selectedIndex = -1;
      alert("💣 成功炸毀障礙物！");
      updateUI();
      return;
    }

    if (curHoney < card.cost) { alert("蜜糖不足！"); return; }
    if (gameState.grid[index] !== null) { alert("此位置無法放置！"); return; }

    if (gameMode === 'story') {
      if (currentCountry.id === 'dolphin' && isP1 && Math.random() < 0.25) {
        gameState.p1Honey -= card.cost;
        gameState.hand.splice(gameState.selectedIndex, 1);
        gameState.selectedIndex = -1;
        alert("🌊 小熊熊太怕水了！放置建築失敗！");
        updateUI();
        return;
      }
      if (currentCountry.id === 'dalmatian' && Math.random() < 0.2) {
        alert("⛈️ 突然下起暴雨！建築放置失敗！");
        gameState.p1Honey -= card.cost;
        updateUI();
        return;
      }
    }

    if (gameMode === 'pvp') {
      if (isP1) { gameState.p1Honey -= card.cost; gameState.p1Score += card.points; }
      else { gameState.p2Honey -= card.cost; gameState.p2Score += card.points; }
      gameState.grid[index] = { ...card, owner: gameState.activePlayer };
    } else {
      gameState.p1Honey -= card.cost;
      gameState.p1Score += card.points;
      gameState.grid[index] = { ...card };
      if (card.id === 'dal_house') gameState.dalmatianHouses++;
    }

    gameState.hand.splice(gameState.selectedIndex, 1);
    gameState.selectedIndex = -1;
    document.getElementById('ui-log').innerText = `✨ 成功放置 ${card.name}！`;
    updateUI();
  }

  /* --- 3 大小遊戲完整邏輯實作 --- */
  function triggerForestMiniGame() {
    const games = ['poker', 'sudoku', 'memory'];
    const selectedGame = games[Math.floor(Math.random() * games.length)];
    const modal = document.getElementById('minigame-modal');
    const content = document.getElementById('minigame-content');
    modal.classList.add('active');

    // 1. 比大小
    if (selectedGame === 'poker') {
      const currentCard = Math.floor(Math.random() * 10) + 1;
      content.innerHTML = `
        <h2>🃏 森林卡牌接龍</h2>
        <p>當前卡牌點數：<b style="font-size:1.8rem; color:#ff9800;">${currentCard}</b></p>
        <p>請猜下一張牌比當前牌大還是小？</p>
        <div style="display:flex; gap:10px; margin:15px 0;">
          <button class="btn" onclick="playPokerGame(${currentCard}, 'bigger')">📈 比大</button>
          <button class="btn" onclick="playPokerGame(${currentCard}, 'smaller')">📉 比小</button>
        </div>
      `;
    } 
    // 2. 6x6 簡易數獨點擊解密
    else if (selectedGame === 'sudoku') {
      content.innerHTML = `
        <h2>🧩 6x6 森林數獨解密</h2>
        <p>請找出並點擊缺少的正確數字以獲取蜜糖：</p>
        <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:15px 0;">
          <div class="mini-game-cell">1</div>
          <div class="mini-game-cell">2</div>
          <div class="mini-game-cell">3</div>
          <div class="mini-game-cell">4</div>
          <div class="mini-game-cell">5</div>
          <div class="mini-game-cell" style="background:#ffe082; color:#d81b60; font-size:1.1rem;" onclick="finishMiniGame(true, 3)">❓</div>
        </div>
      `;
    } 
    // 3. 圖案記憶連連看
    else {
      content.innerHTML = `
        <h2>🎴 圖案記憶連連看</h2>
        <p>點擊翻開卡牌，翻出 🍯 即可採集蜂蜜！</p>
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:15px 0;" id="memory-cards-container">
          <div class="memory-card" onclick="flipMemoryCard(this, '🍯')">❓</div>
          <div class="memory-card" onclick="flipMemoryCard(this, '🌸')">❓</div>
          <div class="memory-card" onclick="flipMemoryCard(this, '🌸')">❓</div>
          <div class="memory-card" onclick="flipMemoryCard(this, '🍯')">❓</div>
        </div>
      `;
    }
  }

  function playPokerGame(currentCard, choice) {
    const nextCard = Math.floor(Math.random() * 10) + 1;
    const win = (choice === 'bigger' && nextCard >= currentCard) || (choice === 'smaller' && nextCard <= currentCard);
    alert(`下一張牌是：${nextCard}！\n${win ? '🎉 猜對了！採到 3 個蜜糖！' : '❌ 猜錯了，沒採到蜜糖！'}`);
    finishMiniGame(win, 3);
  }

  let memoryFlippedCount = 0;
  function flipMemoryCard(el, icon) {
    if (el.innerText !== '❓') return;
    el.innerText = icon;
    if (icon === '🍯') {
      alert("🎉 翻到了 🍯！成功獲得 2 個蜜糖！");
      finishMiniGame(true, 2);
    } else {
      memoryFlippedCount++;
      if (memoryFlippedCount >= 2) {
        alert("❌ 沒翻到蜜糖！採蜜失敗！");
        finishMiniGame(false, 0);
      }
    }
  }

  function finishMiniGame(success, reward = 2) {
    forestMiniGameCount++; // 增加採蜜計數
    if (success) {
      if (gameMode === 'pvp') {
        if (gameState.activePlayer === 'p1') gameState.p1Honey += reward;
        else gameState.p2Honey += reward;
      } else {
        gameState.p1Honey += reward;
      }
    }
    closeModal('minigame-modal');
    updateUI();
  }

  /* --- 黑市 --- */
  function openBlackMarket() {
    const modal = document.getElementById('blackmarket-modal');
    const container = document.getElementById('blackmarket-items');
    container.innerHTML = `
      <div style="background:#f5f5f5; padding:8px; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>💣 炸彈卡</b><br><span style="font-size:0.65rem;">可炸毀地圖障礙物</span></div>
        <button class="btn" style="width:auto; padding:4px 8px;" onclick="buyBlackMarketItem('bomb', 3)">3 🍯 購買</button>
      </div>
    `;
    modal.classList.add('active');
  }

  function buyBlackMarketItem(itemId, cost) {
    let honey = gameMode === 'pvp' ? (gameState.activePlayer === 'p1' ? gameState.p1Honey : gameState.p2Honey) : gameState.p1Honey;
    if (honey < cost) { alert("蜜糖不足！"); return; }
    
    if (gameMode === 'pvp') {
      if (gameState.activePlayer === 'p1') gameState.p1Honey -= cost; else gameState.p2Honey -= cost;
    } else {
      gameState.p1Honey -= cost;
    }
    gameState.hand.push({ id: 'bomb', name: '炸彈卡', icon: '💣', cost: 0, points: 0 });
    alert("🖤 成功購買炸彈卡！已加入手牌！");
    closeModal('blackmarket-modal');
    updateUI();
  }

  /* --- 換回合與結算 --- */
  function finishTurn() {
    forestMiniGameCount = 0; // 重置每回合小遊戲次數

    if (gameMode === 'story' && currentCountry.id === 'pinkbear' && gameState.round >= 5) {
      const emptyCells = gameState.grid.map((c, i) => c === null ? i : -1).filter(i => i !== -1);
      if (emptyCells.length > 0) {
        const expandIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        gameState.grid[expandIndex] = { type: 'lake', name: '擴展湖水', icon: '🌊' };
        gameState.lakeExpandCount++;
        alert("⚠️ 第 5 局後湖水擴展了 1 格！扣除 20 分！");
      }
    }

    if (gameState.activePlayer === 'p1') {
      gameState.activePlayer = 'p2';
    } else {
      if (gameState.round >= gameState.maxRounds) {
        endGame();
        return;
      }
      gameState.round++;
      gameState.activePlayer = 'p1';
    }

    updateUI();
  }

  function endGame() {
    switchScreen('end-screen');
    const statusEl = document.getElementById('end-status');
    const detailsEl = document.getElementById('end-details');

    if (gameMode === 'pvp') {
      let winnerText = "";
      if (gameState.p1Score > gameState.p2Score) winnerText = "🏆 🐻 小熊熊 獲勝！";
      else if (gameState.p2Score > gameState.p1Score) winnerText = "🏆 🐷 毛巾豬 獲勝！";
      else winnerText = "🤝 平手，不分勝負！";

      statusEl.innerText = winnerText;
      statusEl.style.color = "#ff9800";
      detailsEl.innerText = `🐻 小熊熊 得分：${gameState.p1Score} 分\n🐷 毛巾豬 得分：${gameState.p2Score} 分`;
    } else {
      let passed = true;
      let reason = "";

      if (currentCountry.id === 'dalmatian') {
        if (gameState.dalmatianHouses < 10) { passed = false; reason += "❌ 斑點狗屋不足 10 個！\n"; }
        if (gameState.p1Score < 400) { passed = false; reason += "❌ 分數未達 400 分！\n"; }
      } else if (currentCountry.id === 'dolphin') {
        let validDolphins = true;
        gameState.grid.forEach((cell, idx) => {
          if (cell && cell.id === 'dol_house') {
            const adj = [idx-1, idx+1, idx-6, idx+6];
            const hasLib = adj.some(i => i>=0 && i<36 && gameState.grid[i]?.id === 'library');
            if (!hasLib) validDolphins = false;
          }
        });
        if (!validDolphins) { passed = false; reason += "❌ 部分海豚屋附近沒有圖書館！\n"; }
        if (gameState.p1Score < 450) { passed = false; reason += "❌ 分數未達 450 分！\n"; }
      } else if (currentCountry.id === 'pinkbear') {
        const penalty = gameState.lakeExpandCount * 20;
        gameState.p1Score -= penalty;
        if (gameState.p1Score < 450) { passed = false; reason += `❌ 扣除湖水擴張懲罰(${penalty}分)後未達 450 分！\n`; }
      } else if (currentCountry.id === 'penguin') {
        let remaining = gameState.grid.filter(c => c && c.type === 'obstacle').length;
        const penalty = remaining * 20;
        gameState.p1Score -= penalty;
        if (gameState.p1Score < 500) { passed = false; reason += `❌ 殘留 ${remaining} 個障礙物(扣${penalty}分)，未達 500 分！\n`; }
      }

      if (passed) {
        markCountryPassed(currentCountry.id); // 記錄過關狀態
        statusEl.innerText = "🎉 拯救成功！成功完成拯救任務！";
        statusEl.style.color = "#388e3c";
      } else {
        statusEl.innerText = "💥 拯救失敗！";
        statusEl.style.color = "#d32f2f";
      }
      detailsEl.innerText = `最終合作總分：${gameState.p1Score} 分\n` + reason;
    }
  }
</script>
